<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Dollar sign / budget symbol -->
  <text x="256" y="320" font-family="Arial, sans-serif" font-size="240" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">$</text>
  <!-- AI sparkle dots - top right -->
  <circle cx="380" cy="120" r="16" fill="rgba(255,255,255,0.9)"/>
  <circle cx="410" cy="155" r="10" fill="rgba(255,255,255,0.7)"/>
  <circle cx="355" cy="90" r="8" fill="rgba(255,255,255,0.6)"/>
  <!-- Circuit/AI lines -->
  <line x1="370" y1="130" x2="400" y2="150" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
  <line x1="370" y1="120" x2="350" y2="95" stroke="rgba(255,255,255,0.5)" stroke-width="3"/>
</svg>
